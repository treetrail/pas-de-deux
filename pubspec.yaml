name: pasdedeux
description: "Pas de deux – 36 Fragen zum Kennenlernen"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/questions.json
    - assets/sounds/look_end.wav
    - assets/fonts/Fraunces-OFL.txt
    - assets/fonts/Figtree-OFL.txt
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Light.ttf
          weight: 300
        - asset: assets/fonts/Fraunces-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Italic.ttf
          weight: 400
          style: italic
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
