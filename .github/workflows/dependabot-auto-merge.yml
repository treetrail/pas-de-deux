name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  # Shared job, see https://github.com/christoph-sens/ci-workflows
  auto-merge:
    uses: christoph-sens/ci-workflows/.github/workflows/dependabot-auto-merge.yml@e6c58d6668aceac769ad729869cd6307ecaa5026 # v1.5.0
    secrets:
      # Dependabot secret: a merge with GITHUB_TOKEN would start no CI run on main.
      merge-token: ${{ secrets.AUTO_MERGE_TOKEN }}
